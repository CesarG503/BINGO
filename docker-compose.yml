services:
  app:
    build: .
    container_name: app_bingo
    restart: always
    env_file:
      - .env
    ports:
      - "${HOST_PORT}:${PORT}" # host:container
    environment:
      - PORT=${PORT}
      - NODE_ENV=${NODE_ENV}
      - DB_HOST=${DB_HOST}
      - DATA_BASE_URL=${DATA_BASE_URL}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - API_BASE_URL=${API_BASE_URL}
      - QR_BASE_URL=${QR_BASE_URL}
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: db_bingo
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  postgres_data:


