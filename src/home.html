<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Mixgyt/RetroSci-Fi_library/dist/css/sci-fi.css">
    <script src="https://cdn.jsdelivr.net/gh/Mixgyt/RetroSci-Fi_library/dist/js/retrosci-fi.js" defer></script>
    <link rel="stylesheet" href="/css/perfil.css">
    <link rel="stylesheet" href="css/tiendaUser.css">
    <link rel="stylesheet" href="/css/tienda.css">

</head>

<body>

    <button class="btn-custom logout" id="logoutBtn" onclick="logout()" style="max-width: 75px;"><img src="/img/logout.png"
            alt="Logout"></button>

    <div class="container layout-btn">
        <div class="row g-2 justify-content-center">
            <div class="container sala">
                <h1>Entra a una sala!</h1>
                <div class="room-input-wrapper position-relative mx-auto" style="max-width: 420px;">
                    <input type="text" class="room-id" id="room-id" placeholder="Código de sala (ej. ABC12)" maxlength="15" autocomplete="off" spellcheck="false">
                    <span id="roomInputSpinner" class="spinner-border spinner-border-sm text-info room-spinner position-absolute" style="display: none; right: 15px; top: 16px;"></span>
                </div>
                <div id="roomFeedback" class="room-feedback mt-2" style="display: none;"></div>
            </div>
            <div id="btn-unirse" class="col-6 col-sm-4 col-md-3 col-lg-2 btn-unirse">
                <a type="button" class="btn-custom w-100 home" id="joinRoomBtn">
                    <img src="./img/home.png" alt="Home">
                    <span>Unirme</span>
                </a>
            </div>
            <div class="col-6 col-sm-4 col-md-3 col-lg-2">
                <a href="/tienda" class="btn-custom w-100 tienda">
                    <img src="./img/tienda.png" alt="Tienda">
                    <span>Tienda</span>
                </a>
            </div>
            <div class="col-6 col-sm-4 col-md-3 col-lg-2">
                <a href="/documentacion" class="btn-custom w-100 perfil">
                    <img src="./img/doc.png" alt="Docmentacion">
                    <span>Documentación</span>
                </a>
            </div>
        </div>
    </div>
    <!-- panel de cartones (desaturado y responsive) -->
    <div class="container my-3 px-2 px-sm-3" id="cartonesSection" style="display: none;">
        <!-- Barra superior compacta -->
        <div class="cartones-header-bar d-flex justify-content-between align-items-center p-2 px-3 mb-3 rounded">
            <div class="d-flex align-items-center gap-2">
                <button class="btn btn-outline-secondary btn-sm" id="btnChangeRoom" title="Cambiar de sala">
                    <i class="fas fa-arrow-left"></i>
                </button>
                <div class="d-flex align-items-baseline gap-1">
                    <span class="text-white-50 small">Sala:</span>
                    <span id="contextRoomId" class="text-warning fw-bold">---</span>
                </div>
            </div>

            <!-- Contador de selección -->
            <div>
                <span class="badge bg-secondary fs-6 px-3 py-1" id="selectedCount">0/4</span>
            </div>

            <!-- Botones de utilidad compactos -->
            <div class="d-flex align-items-center gap-2">
                <button class="btn btn-outline-info btn-sm" id="btnRandomCartones" title="Seleccionar al azar">
                    <i class="fas fa-dice"></i><span class="d-none d-sm-inline ms-1">Azar</span>
                </button>
                <button class="btn btn-outline-secondary btn-sm" id="btnClearCartones" title="Limpiar selección">
                    <i class="fas fa-eraser"></i>
                </button>
            </div>
        </div>

        <!-- Contenedor de cartones -->
        <div class="row g-2 g-md-3 justify-content-center" id="userCartonesContainer">
            <div class="col-12 text-center py-4">
                <div class="spinner-border spinner-border-sm text-info" role="status"></div>
                <p class="text-white-50 mt-2 small">Cargando cartones...</p>
            </div>
        </div>

        <!-- Barra inferior de confirmación (Sticky en móvil) -->
        <div class="cartones-footer-bar text-center mt-3 pt-2">
            <button class="btn btn-secondary px-3 me-2" id="cancelCartonesBtn">
                Cancelar
            </button>
            <button class="btn btn-success px-4" id="confirmCartonesBtn" disabled>
                Entrar a la Sala
            </button>
        </div>
    </div>
    <!--BORON PERFIL -->
    <div class="profile-icon" onclick="toggleProfilePanel()" id="imagenPequeña"></div>
    <!--FIN DE PERFIL-->
    <div class="profile-panel" id="profilePanel">
        <div class="row align-items-center">
            <div class="col">
                <a href="/tienda" class="btn-custom w-100 tienda" style="max-width: 75px;">
                    <img src="/img/tienda.png" alt="Tienda">
                </a>
            </div>
            <div class="col d-flex flex-row-reverse">
                <a onclick="toggleProfilePanel()" id="botonCerrar" class="btn-custom w-100 cerrar"
                    style="max-width: 75px;">
                    <img src="/img/cerrar.png" alt="Cerrar">
                </a>
            </div>
        </div>

        <div class="profile-img-container">
            <div class="d-flex justify-content-center" id="imgUse">
                <!-- La imagen se carga dinámicamente -->
            </div>
            <div class="text-center" style="padding-top: 5px;">
                <button class="btn bingo-button px-4 py-2 estilo-brillo" onclick="toggleImageDropdown()">
                    <i class="bi bi-pencil-square me-2"></i> Editar Imagen
                </button>
            </div>

            <div id="imageDropdown" class="image-selector shadow p-3 rounded bg-white" style="display: none;">
                <div class="d-flex flex-wrap gap-2 justify-content-center" id="listImgs">
                    <!-- Las imágenes se generan dinámicamente -->
                </div>
            </div>

            <input type="file" id="fileInput" accept="image/*" style="display: none"
                onchange="updateProfileImage(event)">
        </div>

        <div class="info-section">
            <label>Créditos:</label>
            <p class="editable-text me-2" id="creditos">120</p>
        </div>

        <div class="info-section">
            <label>Username:</label>
            <div class="d-flex align-items-center">
                <span id="username" class="editable-text me-2">U</span>
                <button class="bingo-button edit-inline-btn estilo-brillo" onclick="hacerEditable('username')">
                    <i class="bi bi-pencil-fill"></i>
                </button>
            </div>
        </div>

        <div class="info-section mb-3">
            <label>Email:</label>
            <div class="d-flex align-items-center">
                <span id="email" class="editable-text me-2"></span>
                <button class="bingo-button edit-inline-btn estilo-brillo" onclick="hacerEditable('email')">
                    <i class="bi bi-pencil-fill"></i>
                </button>
            </div>
        </div>

        <div class="text-center mt-4">
            <button class="btn bingo-button px-4 py-2 estilo-brillo" onclick="guardarPerfil()">
                <i class="bi bi-save-fill me-2"></i>Guardar cambios
            </button>
        </div>
    </div>
    <!--FIN DE PERFIL-->
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            setTimeout(async () => {
                if (typeof loadActiveGames === 'function') {
                    await loadActiveGames();
                }
            }, 1000);
        });
    </script>
    <script type="module" src="/js/DOM/home.js"></script>
    <script src="/js/perfil/script.js" defer></script>
    <script src="/js/perfil/perfil.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/js/login/logout.js"></script>
</body>

</html>
